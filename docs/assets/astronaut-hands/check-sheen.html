<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #121922;
        color: white;
        font: 16px sans-serif;
      }
      header {
        display: flex;
        justify-content: space-around;
        padding: 12px;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <span>Exportador: sheen 100%</span><span>Autoría: sheen 6,5%</span>
    </header>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(1200, 600)
      renderer.setPixelRatio(1)
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      document.body.append(renderer.domElement)
      const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 10)
      camera.position.set(0, -0.08, 0.8)
      camera.lookAt(0, -0.08, 0)
      const scenes = []
      for (const variant of [0, 1]) {
        const scene = new THREE.Scene()
        scene.background = new THREE.Color('#202a33')
        scene.add(new THREE.HemisphereLight('#fff0db', '#52606b', 1.3))
        const light = new THREE.DirectionalLight('#ffe4c5', 2)
        light.position.set(3, 5, 4)
        scene.add(light)
        const asset = await new GLTFLoader().loadAsync(
          '/models/cruz-del-sur-hand-interactions.glb',
        )
        if (variant === 0)
          asset.scene.traverse((o) => {
            if (o.isMesh)
              for (const mat of Array.isArray(o.material)
                ? o.material
                : [o.material])
                if (mat.sheen > 0) mat.sheenColor.setRGB(1, 1, 1)
          })
        for (const root of asset.scene.children)
          root.visible = root.name === 'TABLET_ASSEMBLY'
        scene.add(asset.scene)
        const mixer = new THREE.AnimationMixer(asset.scene)
        const action = mixer.clipAction(
          asset.animations.find((a) => a.name === 'tablet_raise'),
        )
        action.setLoop(THREE.LoopOnce, 1)
        action.clampWhenFinished = true
        action.play()
        mixer.setTime(0.8)
        scene.updateMatrixWorld(true)
        scenes.push(scene)
      }
      renderer.setScissorTest(true)
      scenes.forEach((scene, i) => {
        renderer.setViewport(i * 600, 0, 600, 600)
        renderer.setScissor(i * 600, 0, 600, 600)
        renderer.render(scene, camera)
      })
      window.done = true
    </script>
  </body>
</html>
